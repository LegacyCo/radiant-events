# One-off diagnostic: capture a reference List Section carousel. Screenshots go to the
# diagnostics branch and get wiped after review. Safe to delete.
name: Capture list carousel
on:
  workflow_dispatch:
    inputs:
      url: { default: "https://goliveevermore.squarespace.com/home" }
      password: { default: "demo" }
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/capture_list.mjs "${{ inputs.url }}" "${{ inputs.password }}"
      - name: Push screenshots to the diagnostics branch
        run: |
          cd shots && git init -q -b diagnostics && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "List carousel capture"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostics
