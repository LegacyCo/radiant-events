# One-off diagnostic for finding Church Center's calendar endpoints. Safe to delete.
name: Probe Church Center API

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/probe_churchcenter.py
