# One-off diagnostic: render live Radiant pages and report what the events embed does. Safe to delete.
name: Check live site

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Arguments for tools/check_site.mjs"
        default: "https://radiantcentralcoast.com/ https://radiantcentralcoast.com/events"

permissions:
  contents: write   # pushes screenshots to the diagnostics branch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: node tools/check_site.mjs ${{ inputs.urls }}
      - name: Save screenshots to the diagnostics branch
        if: always()
        run: |
          git config user.name "radiant-events check"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diagnostics
          git rm -rq --cached . && git add shots && git commit -qm "Site check screenshots" && git push -fq origin diagnostics

