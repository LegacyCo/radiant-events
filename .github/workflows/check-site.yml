# Renders the live preview page and reports what the embeds show. Safe to delete.
name: Check live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to check"
        default: "https://legacyco.github.io/radiant-events/preview.html"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/check_site.mjs "${{ inputs.url }}"
