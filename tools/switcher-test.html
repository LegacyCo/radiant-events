<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  CHURCH YOUTUBE STREAM SWITCHER — Squarespace Code Block     ║
  ║                                                              ║
  ║  Paste this entire file into a Squarespace Code Block.       ║
  ║                                                              ║
  ║  SETUP — fill in the three config values below:              ║
  ║                                                              ║
  ║  1. API_KEY       — YouTube Data API v3 key                  ║
  ║     → console.cloud.google.com → APIs & Services → Creds     ║
  ║     → restrict it: Websites = radiantcentralcoast.com/*      ║
  ║       and API = YouTube Data API v3 only                     ║
  ║                                                              ║
  ║  2. CHANNEL_ID    — Your church's YouTube channel ID         ║
  ║     → youtube.com/@YourChannel → About → Share Channel       ║
  ║     → Copy Channel ID  (starts with UC…)                     ║
  ║                                                              ║
  ║  3. PLAYLIST_ID   — Sermon playlist ID                       ║
  ║     → Open the playlist → copy ID from URL  (starts with PL) ║
  ║                                                              ║
  ║  QUOTA: YouTube gives 10,000 units a day. This version       ║
  ║  checks for a live stream once per page view, then every     ║
  ║  minute only during LIVE_WINDOWS (every 10 min otherwise),   ║
  ║  only while the tab is open on screen, and shares one        ║
  ║  answer across a visitor's tabs. The sermon player needs no  ║
  ║  quota at all, so it still works if the quota runs out.      ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<style>
  /* ── LIVE BANNER (injected into body, fixed top) ─────────── */
  #cp-live-banner {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: #cc0000;
    color: #fff;
    font-family: 'aktiv-grotesk-extended', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    padding: 12px 48px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    animation: cp-banner-in 0.4s ease;
    box-sizing: border-box;
    overflow: hidden; /* clip radar ring animation */
  }
  #cp-live-banner.cp-banner--visible {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  @keyframes cp-banner-in {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  /* Radar inside banner */
  #cp-live-banner .cp-radar {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  #cp-live-banner .cp-radar__dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    position: relative;
    z-index: 2;
  }
  #cp-live-banner .cp-radar__ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    width: 7px; height: 7px;
    animation: cp-radar-pulse 1.6s ease-out infinite;
  }
  #cp-live-banner .cp-radar__ring:nth-child(2) { animation-delay: 0s;    }
  #cp-live-banner .cp-radar__ring:nth-child(3) { animation-delay: 0.55s; }
  #cp-live-banner .cp-radar__ring:nth-child(4) { animation-delay: 1.1s;  }

  /* Watch live link inside banner */
  #cp-live-banner a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(255,255,255,0.6);
    cursor: pointer;
  }
  #cp-live-banner a:hover {
    text-decoration-color: #fff;
  }

  /* Dismiss button */
  #cp-live-banner .cp-banner__close {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.75);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
  }
  #cp-live-banner .cp-banner__close:hover { color: #fff; }

  /* Push page content down so banner doesn't cover it */
  body.cp-banner-open {
    padding-top: 48px !important;
  }

  /* Desktop text visible, mobile text hidden */
  .cp-banner__msg-desktop { display: inline; }
  .cp-banner__msg-mobile  { display: none;   }

  /* Mobile: swap to short label, fix height */
  @media (max-width: 600px) {
    #cp-live-banner {
      font-size: 11px;
      letter-spacing: 1px;
      padding: 10px 36px 10px 10px;
    }
    .cp-banner__msg-desktop { display: none;   }
    .cp-banner__msg-mobile  { display: inline; }
    body.cp-banner-open { padding-top: 40px !important; }
  }

  /* ── WIDGET WRAP ────────────────────────────────────────── */
  .cp-wrap {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    font-family: inherit;
  }

  /* Button row — above the player, centered */
  .cp-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 60px;
  }
  @media (max-width: 767px) {
    .cp-actions { margin-bottom: 30px; }
  }

  /* Default state — cream pill matching site "WATCH NOW" */
  .cp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 44px;
    border-radius: 50px;
    text-decoration: none;
    font-family: 'aktiv-grotesk-extended', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #1a1a1a;
    background: #e5dbbe;
    border: none;
    transition: background 0.2s, transform 0.1s;
    cursor: pointer;
    white-space: nowrap;
  }
  .cp-btn:hover  { background: #d4c9a0; color: #1a1a1a; }
  .cp-btn:active { transform: scale(0.97); }
  .cp-btn--hidden { display: none; }

  /* Live state override — red with radar */
  .cp-btn--live {
    background: #cc0000;
    color: #fff;
    letter-spacing: 1px;
  }
  .cp-btn--live:hover { background: #aa0000; color: #fff; }

  /* LIVE badge pill inside button */
  .cp-live-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.25);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* Radar pulse icon */
  .cp-radar {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .cp-radar__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    position: relative;
    z-index: 2;
  }
  .cp-radar__ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.75);
    width: 8px; height: 8px;
    animation: cp-radar-pulse 1.6s ease-out infinite;
  }
  .cp-radar__ring:nth-child(2) { animation-delay: 0s;    }
  .cp-radar__ring:nth-child(3) { animation-delay: 0.55s; }
  .cp-radar__ring:nth-child(4) { animation-delay: 1.1s;  }

  @keyframes cp-radar-pulse {
    0%   { width: 8px;  height: 8px;  opacity: 1; }
    100% { width: 32px; height: 32px; opacity: 0; }
  }

  /* 16:9 responsive iframe container */
  .cp-video {
    display: block;
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    background: #111;
    box-sizing: border-box;
  }
  .cp-video iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  /* Placeholder shown while loading */
  .cp-placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 14px;
    gap: 10px;
  }
  .cp-spinner {
    width: 32px; height: 32px;
    border: 3px solid #333;
    border-top-color: #cc0000;
    border-radius: 50%;
    animation: cp-spin 0.8s linear infinite;
  }
  @keyframes cp-spin { to { transform: rotate(360deg); } }

  /* Status label */
  .cp-status {
    font-family: 'span-semiboldcomp', sans-serif;
    font-size: 13px;
    color: #888;
  }
</style>

<div class="cp-wrap" id="cpWrap">

  <!-- Button above the player -->
  <div class="cp-actions">
    <a id="cpBtn" class="cp-btn cp-btn--hidden" href="#" target="_blank" rel="noopener"></a>
    <span id="cpStatus" class="cp-status"></span>
  </div>

  <!-- 16:9 player -->
  <div class="cp-video" id="cpVideoBlock">
    <iframe
      id="cpIframe"
      src="about:blank"
      title="Radiant on YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
    <div class="cp-placeholder" id="cpPlaceholder">
      <div class="cp-spinner"></div>
      <span>Loading…</span>
    </div>
  </div>

</div>

<script>
(function () {

  /* ── CONFIG ─────────────────────────────────────────────── */
  var API_KEY     = 'YOUR_API_KEY';
  var CHANNEL_ID  = 'UCyFXM_QV8TU7kCYykY1YUfA';
  var PLAYLIST_ID = 'PL-J1TyONqnHIYHcXoTiHBzU7UGX9vWNEd';
  var SHOW_BANNER = true;  // set to false on pages where you don't want the top banner
  var TIMEZONE    = 'America/Los_Angeles';

  // When services usually stream. During these windows the page checks for a
  // live stream every minute; the rest of the week every 10 minutes. Every
  // page view also checks once, so an unscheduled stream is still picked up.
  // days: 0 = Sunday … 6 = Saturday. Times are 24-hour, church time.
  var LIVE_WINDOWS = [
    { days: [0], start: '08:30', end: '13:00' },  // Sunday morning
    { days: [0], start: '17:00', end: '20:30' },  // Sunday evening
    { days: [3], start: '18:00', end: '21:30' }   // Wednesday evening
  ];
  var POLL_IN_WINDOW_MS  = 60 * 1000;       // during LIVE_WINDOWS
  var POLL_OUTSIDE_MS    = 10 * 60 * 1000;  // the rest of the week
  var POLL_WHILE_LIVE_MS = 3 * 60 * 1000;   // while live: is it still on?
  var BACKOFF_MS         = 30 * 60 * 1000;  // after a quota or API error

  // Maps a keyword (case-insensitive, found anywhere in the YouTube title)
  // to the banner message shown to visitors.
  // First match wins. Falls back to "We're live right now!" if nothing matches.
  var STREAM_LABELS = [
    { keyword: 'Sunday AM',  label: 'Sunday Morning Service Live Now' },
    { keyword: 'Altar',      label: 'Join us for Altar — Live Now'     },
    { keyword: 'Sunday PM',  label: 'Sunday Evening Service Live Now'  },
    { keyword: 'Wednesday',  label: 'Wednesday Service Live Now'       }
  ];
  /* ─────────────────────────────────────────────────────────── */

  var iframe      = document.getElementById('cpIframe');
  var btn         = document.getElementById('cpBtn');
  var statusEl    = document.getElementById('cpStatus');
  var placeholder = document.getElementById('cpPlaceholder');
  var videoBlock  = document.getElementById('cpVideoBlock');

  var shownKey    = null;   // what the player shows now: 'live:<id>' or 'sermon'
  var liveNow     = null;   // { id, title } while live
  var latestId    = null;   // newest sermon video, for the button link
  var timer       = null;
  var backoffUntil = 0;

  /* ── SHARED CACHE ─────────────────────────────────────────────
     One answer per visitor, shared by every tab and page that has this
     block, so browsing the site doesn't spend quota on each page. */
  var LIVE_KEY = 'cp-yt-live:' + CHANNEL_ID;
  var SERMON_KEY = 'cp-yt-sermon:' + PLAYLIST_ID;
  var BACKOFF_KEY = 'cp-yt-backoff:' + CHANNEL_ID;

  function cacheGet(key, maxAge) {
    try {
      var v = JSON.parse(localStorage.getItem(key));
      if (v && Date.now() - v.at < maxAge) return v;
    } catch (e) {}
    return null;
  }
  function cacheSet(key, value) {
    try { value.at = Date.now(); localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  /* ── LIVE BANNER ──────────────────────────────────────────── */

  // Create the banner once and inject it into <body>
  var banner = document.createElement('div');
  banner.id = 'cp-live-banner';
  banner.innerHTML =
    '<span class="cp-radar">'
      + '<span class="cp-radar__ring"></span>'
      + '<span class="cp-radar__ring"></span>'
      + '<span class="cp-radar__ring"></span>'
      + '<span class="cp-radar__dot"></span>'
    + '</span>'
    + '<span class="cp-banner__msg-desktop"></span>'
    + '<span class="cp-banner__msg-mobile"></span>'
    + '<button class="cp-banner__close" id="cpBannerClose" aria-label="Dismiss">&times;</button>';
  document.body.appendChild(banner);

  var bannerClose     = document.getElementById('cpBannerClose');
  var bannerDismissed = false;

  // One listener covers the banner links, however often their text changes.
  banner.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('a.cp-blink')) return;
    e.preventDefault();
    videoBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Dismiss button hides banner for the rest of the visit
  bannerClose.addEventListener('click', function () {
    bannerDismissed = true;
    hideBanner();
  });

  function streamLabel(title) {
    var t = (title || '').toLowerCase();
    for (var i = 0; i < STREAM_LABELS.length; i++) {
      if (t.indexOf(STREAM_LABELS[i].keyword.toLowerCase()) !== -1) {
        return STREAM_LABELS[i].label;
      }
    }
    return 'We’re live right now!';
  }

  function showBanner(title) {
    if (!SHOW_BANNER || bannerDismissed) return;
    var desktop = banner.querySelector('.cp-banner__msg-desktop');
    desktop.textContent = streamLabel(title) + '  ';
    desktop.appendChild(blinkLink('Watch Live ↓'));
    var mobile = banner.querySelector('.cp-banner__msg-mobile');
    mobile.textContent = 'Live Now!  ';
    mobile.appendChild(blinkLink('Join Us ↓'));
    banner.classList.add('cp-banner--visible');
    document.body.classList.add('cp-banner-open');
  }
  function blinkLink(text) {
    var a = document.createElement('a');
    a.className = 'cp-blink';
    a.href = '#';
    a.textContent = text;
    return a;
  }

  function hideBanner() {
    banner.classList.remove('cp-banner--visible');
    document.body.classList.remove('cp-banner-open');
  }

  /* ── PLAYER RENDER ────────────────────────────────────────── */

  iframe.addEventListener('load', function () {
    if (iframe.src !== 'about:blank') placeholder.style.display = 'none';
  });

  function setPlayer(key, src) {
    if (key === shownKey) return false;
    shownKey = key;
    iframe.src = src;
    btn.classList.remove('cp-btn--hidden');
    return true;
  }

  function renderLive(id, title) {
    if (!setPlayer('live:' + id, 'https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1')) return;
    btn.href = 'https://www.youtube.com/watch?v=' + id;
    btn.classList.add('cp-btn--live');
    btn.innerHTML =
      '<span class="cp-radar">'
        + '<span class="cp-radar__ring"></span>'
        + '<span class="cp-radar__ring"></span>'
        + '<span class="cp-radar__ring"></span>'
        + '<span class="cp-radar__dot"></span>'
      + '</span>'
      + 'Watch Live <span class="cp-live-badge">Live</span>';
    statusEl.textContent = '';
    showBanner(title);
  }

  // The sermon player needs no quota: YouTube's playlist player starts on the
  // first available video in the playlist and skips private or deleted ones.
  function sermonLink() {
    return latestId
      ? 'https://www.youtube.com/watch?v=' + latestId + '&list=' + PLAYLIST_ID
      : 'https://www.youtube.com/playlist?list=' + PLAYLIST_ID;
  }
  function renderSermon() {
    var src = 'https://www.youtube.com/embed/videoseries?list=' + PLAYLIST_ID + '&rel=0&modestbranding=1';
    if (!setPlayer('sermon', src)) return;
    btn.href = sermonLink();
    btn.classList.remove('cp-btn--live');
    btn.textContent = 'Watch Latest Sermon';
    statusEl.textContent = 'No live service right now';
    hideBanner();
  }

  /* ── YOUTUBE DATA API ─────────────────────────────────────── */

  function ytGet(endpoint, params) {
    var qs = Object.keys(params)
      .map(function (k) { return k + '=' + encodeURIComponent(params[k]); })
      .join('&');
    return fetch('https://www.googleapis.com/youtube/v3/' + endpoint + '?' + qs + '&key=' + API_KEY)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.error) {
          var e = new Error(data.error.message);
          e.reason = data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
          throw e;
        }
        return data;
      });
  }

  /* Is the channel live? Reads the newest uploads (live streams show up there
     as soon as they start). 2 quota units. */
  function fetchLive() {
    return ytGet('playlistItems', {
      part: 'contentDetails',
      playlistId: 'UU' + CHANNEL_ID.slice(2),
      maxResults: 5
    }).then(function (data) {
      var ids = (data.items || []).map(function (i) { return i.contentDetails.videoId; });
      if (!ids.length) return null;
      return ytGet('videos', { part: 'snippet,liveStreamingDetails', id: ids.join(',') }).then(function (vdata) {
        var items = vdata.items || [];
        for (var i = 0; i < items.length; i++) {
          var v = items[i], lsd = v.liveStreamingDetails;
          // Live if YouTube says so, or the stream has started and not ended
          if (v.snippet.liveBroadcastContent === 'live' || (lsd && lsd.actualStartTime && !lsd.actualEndTime)) {
            return { id: v.id, title: v.snippet.title };
          }
        }
        return null;
      });
    });
  }

  /* Newest sermon's video id, for the button link. 1 quota unit, at most
     every 6 hours per visitor; the player works without it. */
  function fetchLatestSermon() {
    var cached = cacheGet(SERMON_KEY, 6 * 60 * 60 * 1000);
    if (cached) return Promise.resolve(cached.id);
    return ytGet('playlistItems', { part: 'snippet', playlistId: PLAYLIST_ID, maxResults: 5 }).then(function (data) {
      var items = data.items || [];
      for (var i = 0; i < items.length; i++) {
        var t = items[i].snippet.title;
        if (t !== 'Private video' && t !== 'Deleted video') {
          cacheSet(SERMON_KEY, { id: items[i].snippet.resourceId.videoId });
          return items[i].snippet.resourceId.videoId;
        }
      }
      return null;
    });
  }

  /* ── SCHEDULE ─────────────────────────────────────────────── */

  function inLiveWindow() {
    var parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: TIMEZONE, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    var day = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.weekday);
    var hm = parts.hour + ':' + parts.minute;
    return LIVE_WINDOWS.some(function (w) {
      return w.days.indexOf(day) !== -1 && hm >= w.start && hm < w.end;
    });
  }

  function interval() {
    if (liveNow) return POLL_WHILE_LIVE_MS;
    return inLiveWindow() ? POLL_IN_WINDOW_MS : POLL_OUTSIDE_MS;
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(check, interval());
  }

  function show() {
    if (liveNow) renderLive(liveNow.id, liveNow.title);
    else renderSermon();
  }

  function check() {
    // Hidden tabs don't check; the next check runs when the tab is back on screen.
    if (document.hidden) return;
    var shared = cacheGet(BACKOFF_KEY, BACKOFF_MS);
    if (shared) backoffUntil = Math.max(backoffUntil, shared.at + BACKOFF_MS);
    if (Date.now() < backoffUntil) { show(); schedule(); return; }

    // Another tab or page checked recently enough: use its answer.
    var cached = cacheGet(LIVE_KEY, Math.min(interval(), POLL_IN_WINDOW_MS));
    if (cached) { liveNow = cached.live; show(); schedule(); return; }

    fetchLive().then(function (live) {
      liveNow = live;
      cacheSet(LIVE_KEY, { live: live });
    }).catch(function (err) {
      // Quota used up or a network problem: keep showing what's there and try
      // again later. Visitors still get the sermon player.
      if (window.console) console.warn('Stream switcher:', err.reason || '', err.message);
      backoffUntil = Date.now() + BACKOFF_MS;
      if (err.reason === 'quotaExceeded' || err.reason === 'dailyLimitExceeded') cacheSet(BACKOFF_KEY, {});
    }).then(function () {
      show();
      schedule();
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) check();
  });

  // Start on the sermon straight away (no waiting on the API), then check for live.
  renderSermon();
  fetchLatestSermon().then(function (id) {
    if (!id) return;
    latestId = id;
    if (shownKey === 'sermon') btn.href = sermonLink();
  }).catch(function () {});
  check();

})();
</script>
